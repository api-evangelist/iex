aid: iex
name: IEX
description: >-
  IEX Group, Inc. operates IEX Exchange, a U.S. national securities exchange for
  equities founded to make trading fairer and more transparent, along with IEX
  Options (coming soon). IEX is known for its Speed Bump, the IEX Signal, and the
  D-Limit order type. Its developer- and data-facing surface is market data and
  connectivity rather than a public REST API: real-time depth-of-book and
  top-of-book feeds (DEEP+, DEEP, and TOPS, plus their SNAP variants) are
  distributed over the binary IEX Transport Protocol (IEX-TP v1), with published
  feed specifications, downloadable historical PCAP samples, and market
  statistics. Data access is arranged through a Data Subscriber Agreement and
  direct or third-party connectivity. Sector: fintech / financial markets
  infrastructure. Backed by Bain Capital Ventures, ICONIQ Capital, IVP, and
  Sapphire Ventures.
